{{- if .Values.ingressRoute.enabled -}}
{{- $ingressRoute := .Values.ingressRoute -}}
{{- $apiVersion := "" -}}
{{- if $ingressRoute.apiVersion -}}
  {{- /* 显式配置，优先使用 */ -}}
  {{- $apiVersion = $ingressRoute.apiVersion -}}
{{- else if .Capabilities.APIVersions.Has "traefik.io/v1alpha1" -}}
  {{- /* 检测到 Traefik v3.x 新版本 API */ -}}
  {{- $apiVersion = "traefik.io/v1alpha1" -}}
{{- else if .Capabilities.APIVersions.Has "traefik.containo.us/v1alpha1" -}}
  {{- /* 检测到 Traefik v2.x 旧版本 API */ -}}
  {{- $apiVersion = "traefik.containo.us/v1alpha1" -}}
{{- else -}}
  {{- fail "Traefik IngressRoute API not detected. Please ensure Traefik is installed in the cluster, or explicitly set ingressRoute.apiVersion in values.yaml (traefik.io/v1alpha1 or traefik.containo.us/v1alpha1)" -}}
{{- end -}}
apiVersion: {{ $apiVersion }}
kind: IngressRoute
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
      {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- with $ingressRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.commonAnnotations $ingressRoute.annotations }}
  annotations: 
    {{- if .Values.commonAnnotations }}
      {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
    {{- with $ingressRoute.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.entryPoints }}
  entryPoints:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  tls:
    secretName: {{ $ingressRoute.tls.secretName }}
  routes:
  {{- range $ingressRoute.expose }}
  - match: Host(`{{ $ingressRoute.hostName }}`) && PathPrefix(`{{ .pathPrefix }}`)
    kind: Rule
    services:
    - name: {{ include "subchart.fullname" (dict "subchartName" .service "context" $) }}
      port: {{ .targetPort }}
  {{- end }}
{{- end -}}
